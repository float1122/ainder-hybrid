name: build
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: scripts/check-secrets.sh --history

  android:
    runs-on: ubuntu-latest
    needs: secrets
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # No google-services.json in CI: the app builds with AI disabled (fallback paths).
      - run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
